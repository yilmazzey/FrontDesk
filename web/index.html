<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#12100e" />
    <meta
      name="description"
      content="FrontDesk is a calmer workspace for focused work."
    />
    <title>FrontDesk — a calmer place to work</title>
    <meta property="og:title" content="FrontDesk — a calmer place to work" />
    <meta
      property="og:description"
      content="A workspace that stays out of your way."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <script>
      // Restore a deep link captured by 404.html on GitHub Pages.
      try {
        const saved = sessionStorage.getItem('fd:redirect')
        if (saved) {
          sessionStorage.removeItem('fd:redirect')
          history.replaceState(null, '', saved)
        }
      } catch {
        /* storage can be unavailable */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
