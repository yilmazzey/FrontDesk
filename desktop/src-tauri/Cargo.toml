[package]
name = "frontdesk-desktop"
version = "0.1.0"
description = "FrontDesk desktop — local-first notes, mail and citations"
edition = "2021"

[lib]
name = "frontdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
