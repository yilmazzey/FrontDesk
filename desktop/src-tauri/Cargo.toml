[package]
name = "frontdesk-desktop"
version = "0.1.0"
description = "FrontDesk desktop — local-first notes, mail and citations"
edition = "2021"

[lib]
name = "frontdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
walkdir = "2"
chrono = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
rusqlite = { version = "0.43.0", features = ["bundled"] }
fastembed = { version = "7.7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest"] }
pdfium-bundled = "0.2.0"
cpal = "0.15"
hound = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
whisper-rs = { version = "0.13", features = ["raw-api", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.13", features = ["raw-api"] }
