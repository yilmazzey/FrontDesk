name: CI

on:
  pull_request:
  push:
    branches: [main, yilmazzey]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            cmake \
            libclang-dev \
            patchelf \
            tesseract-ocr \
            poppler-utils

      - name: Install workspace dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run version:check

      - name: Build web
        run: npm run build:web

      - name: Build desktop frontend
        run: npm run build:desktop

      - name: Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: npm test
